# Step 1: test profile, activated in tests via @ActiveProfiles("test") or
# @SpringBootTest(properties = "spring.profiles.active=test").
#
# Deliberately does NOT set a datasource URL, spring.data.redis.host/port,
# or app.otp.provider's HTTP endpoint here - those are wired per-test-class
# from a real (throwaway) Testcontainers Postgres/Redis via
# @DynamicPropertySource, so every test run gets a clean instance instead of
# sharing state through a hardcoded connection. See IntegrationTestBase
# (Step 2).

# Mirrors prod's schema-management strategy (Flyway-owned, validated - not
# dev's Hibernate ddl-auto=update) so migration bugs surface in tests instead
# of only in prod.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Never hit a real SMS/email provider from a test run.
app.otp.provider=logging
app.otp.log-to-console=false
app.email.log-to-console=false

# app.secret-encryption-key has no fallback and fails boot if blank (see
# SecretEncryptionService) - this is a TEST-ONLY AES-256 key, 32 random
# bytes, base64-encoded (openssl rand -base64 32). It protects nothing real
# and must never be reused outside this properties file.
app.secret-encryption-key=rrS5Jg7xpHcoS62m9F6LakKVWEi0cTz0iAH6yVSmyzA=

# app.authorization-server.signing-key-pem is intentionally left unset:
# AuthorizationServerConfig already falls back to a fresh ephemeral in-memory
# RSA key with a warning when this is blank, which is exactly what a test
# run wants (no persistence needed across test JVMs).

# Spring Modulith owns event_publication via Flyway's V15 migration in this
# profile (matches prod), not via schema-initialization like dev does.
spring.modulith.events.schema-initialization.enabled=false

# spring.modulith.detection-strategy used to be set here (Step 17A), but
# Spring Modulith's own ApplicationModules.of()/verify() bootstrap builds
# its own throwaway Environment for this one property - it is NOT
# profile-aware and never reads this file, @ActiveProfiles("test")
# notwithstanding. A first attempt moved it into a plain
# src/test/resources/application.properties, but that file shadows main's
# application.properties for every test in the suite (Maven puts
# target/test-classes ahead of target/classes, and Spring Boot only loads
# one file named application.properties) - it silently dropped
# spring.profiles.active=dev and app.title everywhere, breaking unrelated
# tests. Set as a JVM system property instead, in pom.xml's
# maven-surefire-plugin systemPropertyVariables - Modulith's lookup checks
# system properties before ever reading a file, so this reaches Modulith
# without touching Boot's own config loading at all.
