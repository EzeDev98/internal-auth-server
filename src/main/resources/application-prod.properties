# Configuration for the prod profile.
spring.datasource.url=jdbc:postgresql://${POSTGRES_URL}:${DB_PORT:5432}/${POSTGRES_DB}?sslmode=require
spring.datasource.username=${POSTGRES_USER:}
spring.datasource.password=${POSTGRES_PASSWORD:}

management.server.port=${MANAGEMENT_PORT:8081}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.flyway.clean-disabled=true

app.otp.provider=contiguity
contiguity.api-key=${CONTIGUITY_API_KEY:}
contiguity.sender-app-name=${CONTIGUITY_SENDER_APP_NAME:SyncPoint}

app.email.provider=mailjet
mailjet.api-key=${MAILJET_API_KEY:}
mailjet.secret-key=${MAILJET_SECRET_KEY:}
mailjet.sender-email=${MAILJET_SENDER_EMAIL:}
mailjet.sender-name=${MAILJET_SENDER_NAME:SyncPoint}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.modulith.events.jdbc.schema-initialization.enabled=false
