spring.application.name=internal-auth-server

# ---------------------------------------------------------------------------
# Stage 1 punch-list item 4 ("real configuration and Flyway migrations").
# Datastore choice per environment (dev = MySQL, prod = PostgreSQL, Flyway
# only runs for prod) lives in application-<profile>.properties, selected by
# this property. Defaults to "dev" so a plain `./mvnw spring-boot:run` (with
# `docker compose up mysql redis` running) works with no extra flags; real
# deployments set SPRING_PROFILES_ACTIVE=prod.
# ---------------------------------------------------------------------------
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Base path every controller is mounted under (was previously undefined,
# which crashed the app at startup with an unresolved-placeholder error).
app.title=/api/v1

# Used by SwaggerCustomConfig for the OpenAPI "server" entry.
base-url=${BASE_URL:http://localhost:8080}

# ---------------------------------------------------------------------------
# REQUIRED — set this to a real, reachable OIDC issuer before the app will
# boot. WebSecurityConfig.jwtDecoder() fetches this issuer's
# /.well-known/openid-configuration at startup to validate bearer tokens.
# There is no safe default; leaving this blank fails fast with a clear
# "could not resolve placeholder" / discovery error rather than booting
# into a broken state.
# ---------------------------------------------------------------------------
app.token-issuer-uri=

# ---------------------------------------------------------------------------
# Outbound service-to-service credentials (client-credentials grant),
# consumed by RestClientConfig. Currently UNUSED at runtime: RBAC writes go
# through KeycloakServiceImpl, which is a local-only stub (see its javadoc)
# now that Keycloak integration is disabled. These placeholders exist only
# so RestClientConfig's beans can construct without a startup error; replace
# them with real values (or remove RestClientConfig's Keycloak beans
# entirely) if/when real Keycloak calls are reintroduced, or delete them for
# good once Keycloak is fully retired per the target architecture.
# ---------------------------------------------------------------------------
keycloak.get-token-url=http://localhost:8080/realms/internal-auth/protocol/openid-connect/token
keycloak.client-id=internal-auth-service
keycloak.client-secret=changeme

# ---------------------------------------------------------------------------
# Fixes the confirmed privilege-escalation vulnerability in
# POST /service/roles/assign/user (Stage 1 assessment, "Immediate Next
# Steps" #3): that endpoint let any caller holding the "service" authority
# assign ANY role, admin-tier included, to any user. Comma-separated,
# case-insensitive role names service credentials are allowed to assign
# through that endpoint. Left blank on purpose — fail closed until an
# operator makes an explicit decision about which roles are safe for
# automated service-to-service assignment. The admin-only
# /roles/assign/user endpoint is unaffected by this setting.
# Example: app.service-role-assignment.allowed-roles=basic_access,verified_seller
# ---------------------------------------------------------------------------
app.service-role-assignment.allowed-roles=

# ---------------------------------------------------------------------------
# Redis — session storage (JwtSessionTrackingFilter/SessionStorage) and
# Redisson (RedissonConfig). One shared Redis for both profiles, matching
# compose.yaml's single `redis` service. That service has no auth configured,
# hence the blank password default; set REDIS_PASSWORD for any Redis that
# requires one.
# ---------------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
