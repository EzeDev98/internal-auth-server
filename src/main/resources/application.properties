spring.application.name=internal-auth-server

# ---------------------------------------------------------------------------
# Optional local secrets file, project-root-relative, never committed
# (.gitignore covers it). Lets local dev set real values (like the signing
# key below) once instead of re-exporting env vars every terminal session.
# "optional:" means the app boots fine if this file doesn't exist.
# ---------------------------------------------------------------------------
spring.config.import=optional:file:./application-local.properties

###############################################################
# Active Profile
# No Maven resource-filtering profile is configured in pom.xml, so the old
# @activatedProperties@ placeholder was never substituted and broke boot
# with every run (mvn AND IDE). Driven by env var instead, like every other
# environment-specific value in this file. Defaults to "dev" locally;
# set SPRING_PROFILES_ACTIVE=prod in the real environment.
###############################################################
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
#Application specific properties

# Base path every controller is mounted under (was previously undefined,
# which crashed the app at startup with an unresolved-placeholder error).
app.title=/api/v1

# Used by SwaggerCustomConfig for the OpenAPI "server" entry.
base-url=${BASE_URL:http://localhost:8080}

# ---------------------------------------------------------------------------
# Step 12D - this resource server's own bearer-token issuer to validate
# incoming tokens against. Now defaults to app.self-issuer-uri (this app's
# own authorization server, Step 12A-C) instead of requiring an external
# Keycloak instance - there's no Keycloak instance to point at anymore.
# Still independently overridable (TOKEN_ISSUER_URI) in case that's ever
# needed again, but there's no operational reason to today.
#
# WebSecurityConfig.jwtDecoder() is marked @Lazy specifically because of
# this self-referential default: JwtDecoders.fromIssuerLocation(...) does
# an eager HTTP GET to {issuer}/.well-known/openid-configuration the
# moment the bean is constructed. Building it eagerly during context
# refresh would mean this app calling its own discovery endpoint before
# its own Tomcat is listening - a guaranteed boot failure, not a
# transient one. @Lazy defers construction to the first request that
# actually needs JWT validation, by which point the server is already
# serving its own discovery document. See jwtDecoder()'s javadoc.
# ---------------------------------------------------------------------------
app.token-issuer-uri=${TOKEN_ISSUER_URI:${app.self-issuer-uri}}

# ---------------------------------------------------------------------------
# Step 12A - the issuer this app stamps into tokens it mints itself
# (AuthorizationServerConfig), NOT the issuer above that it validates
# incoming bearer tokens against. Those are two different systems
# (Keycloak vs. this app's own new authorization server) until Step 12D's
# cutover makes them the same one - kept as separate properties so each
# can be pointed independently until then. Defaults to this server's own
# base URL (same value as base-url above), which is what an OAuth2 issuer
# identifier normally is.
# ---------------------------------------------------------------------------
app.self-issuer-uri=${SELF_ISSUER_URI:${base-url}}

# ---------------------------------------------------------------------------
# Step 12B - Base64-encoded PKCS#8 PEM RSA private key AuthorizationServerConfig
# signs self-issued tokens with. Generate one with:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out key.pem
#   openssl base64 -A -in key.pem -out key.pem.b64
# then set AUTH_SIGNING_KEY_PEM to that file's contents. Left blank on
# purpose (no forced-required failure like app.token-issuer-uri above):
# AuthorizationServerConfig falls back to a throwaway in-memory key with a
# logged warning when this is empty, since nothing validates self-issued
# tokens yet (Step 12D). Set this before then.
# ---------------------------------------------------------------------------
app.authorization-server.signing-key-pem=${AUTH_SIGNING_KEY_PEM:}
# ---------------------------------------------------------------------------
# Step 14E - AES-256-GCM key encrypting sensitive material at rest (today:
# signing_key.encrypted_private_key - see SecretEncryptionService and
# SigningKeyServiceImpl). Generate one with `openssl rand -base64 32`.
# Deliberately NO fallback if blank (unlike the signing key above) - losing
# or rotating this key would silently orphan every row it already encrypted,
# so the app fails fast at boot instead. See SecretEncryptionService's
# javadoc for the full reasoning.
# ---------------------------------------------------------------------------
app.secret-encryption-key=${SECRET_ENCRYPTION_KEY:}

# ---------------------------------------------------------------------------
# Step 14B - actuator/metrics/tracing. Actuator runs on its own port
# (separate from server.port/app.title's API surface) so a metrics scraper
# - which has no user/service JWT to present - can reach it without going
# through this app's normal authentication. Being on a different port does
# NOT exempt it from WebSecurityConfig's filter chain by itself (a custom
# SecurityFilterChain bean applies across every connector/port this app
# listens on); WebSecurityConfig has its own explicit
# EndpointRequest.toAnyEndpoint().permitAll() rule for that reason. That
# means whoever deploys this must make sure MANAGEMENT_PORT isn't reachable
# from outside the trusted network, since nothing else protects it.
# ---------------------------------------------------------------------------
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# ---------------------------------------------------------------------------
# Step 14B - trace/span IDs (Micrometer Tracing + the Brave bridge, see
# pom.xml) for every request, propagated across thread boundaries including
# 14A's async @ApplicationModuleListener. Sampling at 100% since there's no
# exporter configured yet (see CorrelationIdFilter's Javadoc) - nothing is
# shipped to an external tracing backend, spans are simply generated,
# correlated in logs via the traceId/spanId MDC values Spring Boot adds to
# the console pattern automatically once tracing is on the classpath, and
# then discarded. Revisit this percentage before adding a real exporter.
# ---------------------------------------------------------------------------
management.tracing.sampling.probability=1.0

# ---------------------------------------------------------------------------
# Step 8 (reverse-proxy IP awareness - deployment checklist item, not yet
# needed): LoginController's rate limiting (and anything else calling
# httpRequest.getRemoteAddr()) sees the raw TCP peer address unless this is
# turned on. Correct as-is for as long as clients connect directly. Off
# ("none", Spring Boot's own default) until an operator makes an explicit
# decision, matching the fail-closed convention used elsewhere in this file
# (see app.service-role-assignment.allowed-roles below) - this line changes
# no runtime behavior today.
#
# To enable once this is ACTUALLY deployed behind a real, trusted reverse
# proxy or load balancer: set FORWARD_HEADERS_STRATEGY=native. That
# activates the embedded Tomcat's RemoteIpValve, which rewrites
# getRemoteAddr() from X-Forwarded-For - but only for requests whose
# immediate TCP peer matches server.tomcat.remoteip.internal-proxies
# (Tomcat's own built-in default there already covers RFC1918 private
# ranges + loopback, which fits most setups where the proxy sits in the
# same private network; override that property explicitly, profile by
# profile, only if your topology needs something else - deliberately not
# set here, so Tomcat's own vetted default applies rather than a
# hand-typed regex). Never set this to "native" unless the proxy in front
# of this app is one you control and trust to strip/overwrite any
# X-Forwarded-For an external client sends - otherwise an attacker can
# spoof a fresh IP per request and bypass the IP-based rate limit entirely
# (Step 4's account-scoped limit is unaffected either way).
# ---------------------------------------------------------------------------
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# ---------------------------------------------------------------------------
# Fixes the confirmed privilege-escalation vulnerability in
# POST /service/roles/assign/user (Stage 1 assessment, "Immediate Next
# Steps" #3): that endpoint let any caller holding the "service" authority
# assign ANY role, admin-tier included, to any user. Comma-separated,
# case-insensitive role names service credentials are allowed to assign
# through that endpoint. Left blank on purpose — fail closed until an
# operator makes an explicit decision about which roles are safe for
# automated service-to-service assignment. The admin-only
# /roles/assign/user endpoint is unaffected by this setting.
# Example: app.service-role-assignment.allowed-roles=basic_access,verified_seller
# ---------------------------------------------------------------------------
app.service-role-assignment.allowed-roles=

# ---------------------------------------------------------------------------
# Redis — session storage (JwtSessionTrackingFilter/SessionStorage) and
# Redisson (RedissonConfig). One shared Redis for both profiles, matching
# compose.yaml's single `redis` service. That service has no auth configured,
# hence the blank password default; set REDIS_PASSWORD for any Redis that
# requires one.
# ---------------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
