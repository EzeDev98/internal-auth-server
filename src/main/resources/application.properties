# Shared configuration for all profiles.
spring.application.name=internal-auth-server

spring.config.import=optional:file:./application-local.properties

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

app.title=/api/v1

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

base-url=${BASE_URL:http://localhost:5151}

server.port=${PORT:5151}

app.token-issuer-uri=${TOKEN_ISSUER_URI:${app.self-issuer-uri}}

app.self-issuer-uri=${SELF_ISSUER_URI:${base-url}}

app.authorization-server.access-token-ttl-minutes=${ACCESS_TOKEN_TTL_MINUTES:15}
app.authorization-server.refresh-token-ttl-days=${REFRESH_TOKEN_TTL_DAYS:30}

app.authorization-server.signing-key-pem=${AUTH_SIGNING_KEY_PEM:}
app.secret-encryption-key=${SECRET_ENCRYPTION_KEY:}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

management.tracing.sampling.probability=1.0

server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

app.service-role-assignment.allowed-roles=

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}

admin.reset.secret=${ADMIN_RESET_SECRET:}

sync-point.wipe.base-url=${SYNC_POINT_WIPE_BASE_URL:http://localhost:2000/api/v1}
sync-point.wipe.secret=${SYNC_POINT_WIPE_SECRET:}
notare.wipe.base-url=${NOTARE_WIPE_BASE_URL:http://localhost:2001/api/v1}
notare.wipe.secret=${NOTARE_WIPE_SECRET:}

sync-point.session-invalidate.base-url=${SYNC_POINT_SESSION_INVALIDATE_BASE_URL:http://localhost:2000/api/v1}
sync-point.session-invalidate.secret=${SYNC_POINT_SESSION_INVALIDATE_SECRET:}
sync-point.internal-auth-client-id=${SYNC_POINT_INTERNAL_AUTH_CLIENT_ID:sync-point}

notare.user-events.base-url=${NOTARE_USER_EVENTS_BASE_URL:http://localhost:2001/api/v1}
notare.user-events.secret=${NOTARE_USER_EVENTS_SECRET:}
notare.internal-auth-client-id=${NOTARE_INTERNAL_AUTH_CLIENT_ID:notare}

ahorra.wipe.base-url=${AHORRA_WIPE_BASE_URL:http://localhost:2050/api/v1}
ahorra.wipe.secret=${AHORRA_WIPE_SECRET:}
ahorra.session-invalidate.base-url=${AHORRA_SESSION_INVALIDATE_BASE_URL:http://localhost:2050/api/v1}
ahorra.session-invalidate.secret=${AHORRA_SESSION_INVALIDATE_SECRET:}
ahorra.internal-auth-client-id=${AHORRA_INTERNAL_AUTH_CLIENT_ID:ahorra}
