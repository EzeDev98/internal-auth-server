# ---------------------------------------------------------------------------
# Local development datastore: MySQL, matching compose.yaml's `mysql`
# service (`docker compose up mysql redis`). Hibernate manages the schema
# directly here (ddl-auto=update) ? Flyway does NOT run against dev, per
# the "flyway [only] for prod" decision for this punch-list item. `update`
# is fine for a disposable local database; never point this profile at a
# database anyone actually depends on.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/internal_auth_db?serverTimezone=Africa/Lagos
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:}
# Step 6: no real secret committed here (see .gitignore's comment on
# this file - env-var placeholders only, never real credentials). Set
# DB_PASSWORD in your shell, or put the real value in
# application-local.properties (gitignored, auto-imported - same place
# the signing key / secret-encryption-key already go for local dev).
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.flyway.enabled=false

# ---------------------------------------------------------------------------
# Step 3 (durable OAuth2AuthorizationService): dev has no Flyway (see above)
# and this table isn't a JPA @Entity, so ddl-auto=update never creates it.
# spring.sql.init.* applies db/dev-init/oauth2-authorization-schema-mysql.sql
# instead (CREATE TABLE IF NOT EXISTS - safe on every dev restart). Prod gets
# the equivalent table from the V21 Flyway migration instead; mode=always
# only takes effect here since prod never sets these properties.
# ---------------------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/dev-init/oauth2-authorization-schema-mysql.sql

# ---------------------------------------------------------------------------
# Stage 1 punch-list item 6 (OTP delivery provider). Switched from the
# built-in logging provider to Contiguity so real SMS OTPs go out during
# local testing too, not just in prod - see ContiguityOtpDeliveryService
# and application-prod.properties' fuller note on this provider's
# fail-silently-per-request behavior (never blocks the request; check the
# log for "Contiguity OTP send failed" if a code never arrives).
# ---------------------------------------------------------------------------
app.otp.provider=contiguity
contiguity.api-key=${CONTIGUITY_API_KEY:}
contiguity.sender-app-name=${CONTIGUITY_SENDER_APP_NAME_SYNC_POINT:}

# ---------------------------------------------------------------------------
# Step 15E (email delivery provider) - Mailjet, mirroring the Contiguity
# switch above. See MailjetEmailDeliveryService.
# ---------------------------------------------------------------------------
app.email.provider=mailjet
mailjet.api-key=${MAILJET_API_KEY:}
mailjet.secret-key=${MAILJET_SECRET_KEY:}
mailjet.sender-email=${MAILJET_SENDER_EMAIL:}
mailjet.sender-name=${MAILJET_SENDER_NAME:}

# ---------------------------------------------------------------------------
# Step 14A - Spring Modulith's JDBC event publication registry (backs the
# audit-logging event flow - see AuditEventListener's Javadoc). Dev has no
# Flyway migrations (see the ddl-auto=update comment above), so this stays
# on the default: Modulith creates its own event_publication table itself
# on boot. Explicit here (rather than just relying on the default) so the
# dev/prod split is visible at a glance next to application-prod.properties'
# opposite setting.
# ---------------------------------------------------------------------------
spring.modulith.events.jdbc.schema-initialization.enabled=true