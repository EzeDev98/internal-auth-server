# ---------------------------------------------------------------------------
# Production datastore: PostgreSQL. Flyway owns this schema (migrations in
# src/main/resources/db/migration) and Hibernate is restricted to `validate`
# — it checks the entities against the real schema at startup and refuses
# to boot on a mismatch, but never alters a production table itself.
#
# No defaults on the values below, on purpose (same fail-closed pattern as
# app.token-issuer-uri in application.properties): a prod deploy that's
# missing one of these env vars fails fast at startup with a clear
# unresolved-placeholder/connection error, instead of silently booting
# against the wrong database or with an empty password.
# ---------------------------------------------------------------------------
spring.datasource.url=${POSTGRES_URL:}
spring.datasource.username=${POSTGRES_USER:}
spring.datasource.password=${POSTGRES_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Stage 1 punch-list item 6 (OTP delivery provider). Contiguity's plain-text
# SMS API delivers password-reset OTPs (see ContiguityOtpDeliveryService) —
# free tier covers 500 SMS/month. No default on contiguity.api-key: unlike
# the datasource settings above, a missing key does NOT fail startup — by
# design (ContiguityOtpDeliveryService.sendPasswordResetOtp never throws, so
# a provider outage can't change what the "request OTP" endpoint returns and
# leak whether a phone number is registered). A missing/wrong key instead
# fails *silently per-request*: the app boots fine, but no OTP SMS ever goes
# out and only the server log shows it. Verify with a real test reset after
# deploying, and monitor for "Contiguity OTP send failed" / "api-key is not
# configured" log lines.
# ---------------------------------------------------------------------------
app.otp.provider=contiguity
contiguity.api-key=${CONTIGUITY_API_KEY:}
contiguity.sender-app-name=${CONTIGUITY_SENDER_APP_NAME:SyncPoint}
