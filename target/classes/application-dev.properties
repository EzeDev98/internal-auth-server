# ---------------------------------------------------------------------------
# Local development datastore: MySQL, matching compose.yaml's `mysql`
# service (`docker compose up mysql redis`). Hibernate manages the schema
# directly here (ddl-auto=update) — Flyway does NOT run against dev, per
# the "flyway [only] for prod" decision for this punch-list item. `update`
# is fine for a disposable local database; never point this profile at a
# database anyone actually depends on.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:mydatabase}
spring.datasource.username=${MYSQL_USER:myuser}
spring.datasource.password=${MYSQL_PASSWORD:secret}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.flyway.enabled=false

# ---------------------------------------------------------------------------
# Stage 1 punch-list item 6 (OTP delivery provider). Dev stays on the
# built-in logging provider (LoggingOtpDeliveryService) with the raw OTP
# printed to the console, so local password-reset testing doesn't need a
# real Contiguity account or send actual SMS. See application-prod.properties
# for the real provider.
# ---------------------------------------------------------------------------
app.otp.provider=logging
app.otp.log-to-console=true
