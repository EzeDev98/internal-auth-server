# Local Docker Compose services for MySQL, Postgres and Redis.
services:
  mysql:
    image: 'mysql:latest'
    environment:
      - 'MYSQL_DATABASE=mydatabase'
      - 'MYSQL_PASSWORD=${COMPOSE_MYSQL_PASSWORD:-changeme}'
      - 'MYSQL_ROOT_PASSWORD=${COMPOSE_MYSQL_ROOT_PASSWORD:-changeme}'
      - 'MYSQL_USER=myuser'
    ports:
      - '3306'
    labels:
      org.springframework.boot.ignore: true
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=${COMPOSE_POSTGRES_PASSWORD:-changeme}'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'
    labels:
      org.springframework.boot.ignore: true
  redis:
    image: 'redis:latest'
    ports:
      - '6379'
