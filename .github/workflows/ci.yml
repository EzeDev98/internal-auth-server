name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast unit tests (*Test.java via Surefire) — runs on every push, no Docker needed.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit tests
        run: ./mvnw -B test

  # Slower Testcontainers integration tests (*IT.java via Failsafe) — pre-merge gate only.
  integration-tests:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # ubuntu-latest ships Docker preinstalled/running, which is all
      # Testcontainers needs (Postgres + Redis modules from Step 1A/1B).
      - name: Confirm Docker is available
        run: docker info

      - name: Run integration tests + JaCoCo report
        run: ./mvnw -B verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # Step 18D: Step 5/13/14 security-boundary tests are release blockers,
  # reported as their own required check — distinct from general coverage.
  security-boundary-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Confirm Docker is available
        run: docker info

      - name: Run security-boundary tagged tests (unit + Testcontainers IT)
        run: |
          ./mvnw -B test -Dgroups=security-boundary
          ./mvnw -B failsafe:integration-test failsafe:verify -Dgroups=security-boundary
